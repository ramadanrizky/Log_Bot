services:
  - type: web
    name: bot-logistik
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot_logistik:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TZ
        value: Asia/Jakarta
